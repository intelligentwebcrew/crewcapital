<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · Crew Capital</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 15% 0%,#244339 0,transparent 52%),#0c1215;color:#eaf0ef;font:15px system-ui;padding:24px}.card{width:100%;max-width:440px;background:#131e23;border:1px solid #34473e;border-radius:20px;padding:38px;box-shadow:0 24px 90px #0005}.brand{font-size:23px;font-weight:700;letter-spacing:-1px}.brand span{color:#b8e8ba}.tag{font:10px monospace;letter-spacing:2px;color:#8fa4ad;margin:8px 0 36px}h1{font-size:27px;font-weight:500;margin:0 0 10px}p{color:#a6b8bc;line-height:1.6;font-size:13px}label{display:block;font-size:12px;margin-top:22px;color:#cad6d7}input{display:block;width:100%;margin-top:8px;background:#0c1519;color:#eaf0ef;border:1px solid #3a4e54;border-radius:9px;font:16px system-ui;padding:13px}input:focus-visible,button:focus-visible{outline:2px solid #b8e8ba;outline-offset:3px}button{width:100%;margin-top:26px;padding:14px;border:0;border-radius:9px;background:#b8e8ba;color:#14251b;font-size:14px;font-weight:650;cursor:pointer}button:disabled{opacity:.5}#message{min-height:42px;color:#e6bf81;margin:16px 0 0}.footer{padding-top:20px;border-top:1px solid #293a40;font-size:11px;margin-top:18px;color:#8fa4ad}</style></head><body><main class="card"><div class="brand">CREW <span>CAPITAL</span></div><div class="tag">ESCRITÓRIO DE AGENTES · OANDA DEMO</div><h1>Bem-vindo de volta</h1><p>Entre com seu e-mail e senha para acessar o escritório.</p><form id="login"><label for="username">E-mail</label><input id="username" type="email" autocomplete="username" required maxlength="254"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button id="submit" type="submit">Entrar no escritório</button><p id="message" role="status" aria-live="polite"></p></form><div class="footer">Acesso protegido. A sessão permanece ativa por até 30 dias neste navegador. Use Sair em um dispositivo compartilhado.</div></main><script src="/login.js" defer></script></body></html>
